{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: logqueries.lhtx.io
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  group: lhtx.io
  scope: Namespaced
  names:
    kind: LogQuery
    listKind: LogQueryList
    plural: logqueries
    singular: logquery
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [volume, requestedBy]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: a LogQuery cannot be changed
              properties:
                volume:
                  type: string
                  maxLength: 63
                nodes:
                  type: array
                  items:
                    type: string
                since:
                  type: string
                  pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                limitBytes:
                  type: integer
                  minimum: 0
                requestedBy:
                  type: string
                requestedGroups:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
{{- end }}
