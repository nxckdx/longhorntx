{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: volumehistories.lhtx.io
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  group: lhtx.io
  scope: Namespaced
  names:
    kind: VolumeHistory
    listKind: VolumeHistoryList
    plural: volumehistories
    singular: volumehistory
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            events:
              description: The events – gzipped JSON, base64 (prefix gz:).
              type: string
{{- end }}
