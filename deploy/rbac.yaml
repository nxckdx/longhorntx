# The agent's base rights: read Longhorn, pods and their logs, and manage
# its own resources (digests, histories, log queries, the status of Freezes
# and Switches it refuses). Without --rw that is all it does. The rights to
# stop apps and swap PVCs are in rbac-rw.yaml (lhtx agent manifests --rw).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lhtx-agent
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lhtx-agent
rules:
  # its own resources: answer, refuse, record
  - apiGroups: [lhtx.io]
    resources: [freezes, switches, logqueries]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [lhtx.io]
    resources: [freezes/status, freezes/finalizers, switches/status, logqueries/status]
    verbs: [get, patch, update]
  - apiGroups: [lhtx.io]
    resources: [volumedigests, volumehistories]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create] # may the person who asked do this themselves?
  - apiGroups: [authentication.k8s.io]
    resources: [selfsubjectreviews]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list] # is the requester policy installed?
  # read only
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list, watch] # watch: share-manager pods (RWX history)
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get] # LogQueries (lhtx diag): read and filter in the cluster
  - apiGroups: [longhorn.io]
    resources: [volumes, replicas, backups]
    verbs: [get, list, watch] # digests, history
  - apiGroups: [longhorn.io]
    resources: [settings, backupvolumes, engines, nodes] # nodes: capacity samples
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [sharemanagers]
    verbs: [get, list, watch] # RWX history
  # mount check (lhtx mounts): pods stuck mounting, their events, the
  # VolumeAttachments, nodes, CSI registration
  - apiGroups: [""]
    resources: [events, nodes]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments, csinodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lhtx-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lhtx-agent
subjects:
  - kind: ServiceAccount
    name: lhtx-agent
    namespace: longhorn-system
---
# leader election lease + the hooks ConfigMap
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lhtx-agent
  namespace: longhorn-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [lhtx-hooks]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lhtx-agent
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lhtx-agent
subjects:
  - kind: ServiceAccount
    name: lhtx-agent
    namespace: longhorn-system
---
# lhtx finds the agent by reading its lease (who holds it, when renewed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lhtx-agent-lease-reader
  namespace: longhorn-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [lhtx-agent]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lhtx-agent-lease-reader
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lhtx-agent-lease-reader
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
