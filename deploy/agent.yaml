apiVersion: apps/v1
kind: Deployment
metadata:
  name: lhtx-agent
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  replicas: 1 # more replicas wait as standby (leader election)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lhtx-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lhtx-agent
    spec:
      serviceAccountName: lhtx-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/nxckdx/lhtx:latest
          args: [agent, --namespace=longhorn-system]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
