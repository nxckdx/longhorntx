{{- if and .Values.notify.url (not .Values.notify.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lhtx-agent.fullname" . }}-notify
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.notify.secretKey }}: {{ .Values.notify.url | quote }}
{{- end }}
