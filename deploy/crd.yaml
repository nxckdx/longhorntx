# Freeze: a request to the lhtx agent to freeze PVCs (see lhtx freeze --help).
# Deleting it ends the freeze; the agent's finalizer keeps it until the apps
# are back.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: freezes.lhtx.io
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  group: lhtx.io
  scope: Cluster
  names:
    kind: Freeze
    listKind: FreezeList
    plural: freezes
    singular: freeze
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Reason
          type: string
          jsonPath: .spec.reason
        - name: Frozen
          type: date
          jsonPath: .status.frozenAt
        - name: Auto-Unfreeze
          type: string
          jsonPath: .spec.autoUnfreezeAfter
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [pvcs]
              properties:
                pvcs:
                  description: PVCs to freeze, as namespace/name.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-.a-z0-9]*[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: pvcs cannot be changed – create a new Freeze
                reason:
                  type: string
                  maxLength: 256
                autoUnfreezeAfter:
                  description: End the freeze on its own this long after it is frozen (Go duration, e.g. 4h).
                  type: string
                  pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                wait:
                  description: How long to wait for volumes to detach / attach (default 10m).
                  type: string
                  pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
