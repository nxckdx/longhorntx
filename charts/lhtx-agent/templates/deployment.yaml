apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lhtx-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if gt (int .Values.replicaCount) 1 }}
    type: RollingUpdate # the standby takes over the lease
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "lhtx-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lhtx-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lhtx-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - --namespace={{ .Values.longhornNamespace }}
            {{- if .Values.rw }}
            - --rw
            {{- end }}
            {{- with .Values.leaseNamespace }}
            - --lease-namespace={{ . }}
            {{- end }}
            {{- if .Values.history.enabled }}
            - --history-per-volume={{ .Values.history.perVolume }}
            - --history-cluster={{ .Values.history.cluster }}
            {{- with .Values.history.maxAge }}
            - --history-max-age={{ . }}
            {{- end }}
            {{- else }}
            - --no-history
            {{- end }}
            - --capacity-interval={{ .Values.capacity.interval }}
            {{- if .Values.restoreProbe.enabled }}
            - --restore-probe-interval={{ .Values.restoreProbe.interval }}
            - --restore-probe-timeout={{ .Values.restoreProbe.timeout }}
            - --restore-probe-max-size={{ .Values.restoreProbe.maxSize }}
            {{- end }}
            {{- if or .Values.notify.url .Values.notify.existingSecret }}
            - --notify-format={{ .Values.notify.format }}
            - --notify-every={{ .Values.notify.every }}
            {{- with .Values.notify.cluster }}
            - --notify-cluster={{ . }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if or .Values.notify.url .Values.notify.existingSecret }}
            - name: LHTX_NOTIFY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notify.existingSecret | default (printf "%s-notify" (include "lhtx-agent.fullname" .)) }}
                  key: {{ .Values.notify.secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      affinity: # spread the standby replicas over nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "lhtx-agent.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
