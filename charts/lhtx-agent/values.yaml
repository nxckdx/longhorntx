# Namespace of Longhorn. The agent reads Longhorn volumes and the hooks
# ConfigMap lhtx-hooks there, and keeps its lease there – lhtx looks for the
# lease in the Longhorn namespace it is configured for. The agent itself
# runs in the release namespace.
longhornNamespace: longhorn-system

# Where the agent keeps its lease (its heartbeat). Empty = longhornNamespace:
# lhtx finds it there with one GET. Elsewhere (e.g. the release namespace)
# lhtx finds it by its label – users then need to list leases in all
# namespaces (rbac.leaseListForAllUsers).
leaseNamespace: ""

image:
  repository: ghcr.io/nxckdx/lhtx
  tag: "" # default: the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# More than one replica: one is active, the others wait as standby and take
# over within ~30 s (leader election; the lease is also the heartbeat lhtx
# looks for). With more than one, a PodDisruptionBudget keeps one running and
# the pods are spread over nodes (unless affinity is set).
replicaCount: 1

# Probes on the read-only health port 8081 (no actions there): /readyz is
# ready for a standby at once and for the leader once its watches synced;
# /healthz fails if the leader's loop stalls or its lease is overdue.
probes:
  startup:
    httpGet: {path: /readyz, port: health}
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    httpGet: {path: /readyz, port: health}
    periodSeconds: 10
  liveness:
    httpGet: {path: /healthz, port: health}
    periodSeconds: 20
    failureThreshold: 3

# Prometheus metrics on the health port (/metrics): leader, freezes,
# switches, operations, volume events vs digests written.
metrics:
  # a Service for the port, with prometheus.io/scrape annotations
  service: true
  serviceMonitor:
    enabled: false # needs the Prometheus operator (monitoring.coreos.com)
    interval: 60s
    labels: {} # e.g. release: kube-prometheus-stack
  dashboard:
    enabled: false
    # a ConfigMap the Grafana sidecar loads
    labels:
      grafana_dashboard: "1"
    annotations: {} # e.g. grafana_folder: Storage
    namespace: "" # default: the release namespace

# History (lhtx history, TUI H): how much the agent keeps. Older events are
# pushed out by the count; maxAge additionally drops events older than that
# whenever a history is written (e.g. 2160h = 90 days; "" = no age limit).
history:
  enabled: true
  perVolume: 50 # at most 1000
  cluster: 300 # notable events cluster-wide, at most 5000
  maxAge: ""

podDisruptionBudget:
  # created when replicaCount > 1
  minAvailable: 1

crds:
  # Install/upgrade the Freeze CRD with the chart. It is kept on uninstall
  # (deleting it would delete all Freeze resources).
  install: true

serviceAccount:
  create: true
  name: "" # default: the release's full name
  annotations: {}

rbac:
  create: true
  # Let every authenticated user read the agent's lease (only that one
  # object), so lhtx finds the agent. Without it, users need their own get
  # on leases/lhtx-agent in the Longhorn namespace.
  leaseReaderForAllUsers: true
  # Let every authenticated user list leases in all namespaces (only needed
  # with a leaseNamespace other than longhornNamespace; leases hold node and
  # controller heartbeats, nothing secret).
  leaseListForAllUsers: false
  # ClusterRole "<fullname>-freeze" (create/delete Freeze resources) for you
  # to bind to the people who may freeze.
  freezeRole: true

extraArgs: []
extraEnv: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
