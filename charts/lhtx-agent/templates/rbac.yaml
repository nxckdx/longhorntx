{{- if .Values.rbac.create }}
{{- $name := include "lhtx-agent.fullname" . }}
{{- $sa := include "lhtx-agent.serviceAccountName" . }}
{{- $leaseNS := .Values.leaseNamespace | default .Values.longhornNamespace }}
# Base rights: read Longhorn, pods and their logs; manage its own resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  # its own resources: answer, refuse, record
  - apiGroups: [lhtx.io]
    resources: [freezes, switches, logqueries]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [lhtx.io]
    resources: [freezes/status, freezes/finalizers, switches/status, logqueries/status]
    verbs: [get, patch, update]
  - apiGroups: [lhtx.io]
    resources: [volumedigests, volumehistories]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create] # may the person who asked do this themselves?
  - apiGroups: [authentication.k8s.io]
    resources: [selfsubjectreviews]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list] # is the requester policy installed?
  # read only
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list, watch] # watch: share-manager pods (RWX history)
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get] # LogQueries (lhtx diag): read and filter in the cluster
  - apiGroups: [longhorn.io]
    resources: [volumes, replicas, backups]
    verbs: [get, list, watch] # digests, history
  - apiGroups: [longhorn.io]
    resources: [settings, backupvolumes, engines, nodes] # nodes: capacity samples
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [sharemanagers]
    verbs: [get, list, watch] # RWX history
  # mount check (lhtx mounts): pods stuck mounting, their events, the
  # VolumeAttachments, nodes, CSI registration
  - apiGroups: [""]
    resources: [events, nodes]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments, csinodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.mountCheck.kubelet }}
---
# mountCheck.kubelet: ask kubelet (/healthz, /metrics) on nodes with stuck
# mounts through the API server's node proxy. nodes/proxy is a powerful
# right (it reaches every kubelet API) – only if you accept that.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-kubelet
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-kubelet
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-kubelet
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rw }}
---
# rw: true – the agent stops and starts apps: it deletes pods anywhere, execs
# hook commands in them, creates admission policies, patches the owners of
# the pods it stopped (any kind, hence "*"), swaps PVCs and guards keys.
# Treat it like cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-rw
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [create, patch, delete] # the freeze policy
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete] # create: only the server dry run that checks the policy
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create] # hooks
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete] # switches
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [create, patch] # switches: PV of the target, Retain on the old one
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create] # switches of encrypted volumes: guard the key, keep a copy if it is replaced
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [create, delete] # restore for a Switch; restore probe test volumes (only those, with a UID precondition)
  # owners of the stopped pods: read the chain, nudge on unfreeze,
  # CloudNativePG hibernation annotation
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-rw
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-rw
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# the hooks ConfigMap in the Longhorn namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Values.longhornNamespace }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [lhtx-hooks]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Values.longhornNamespace }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# the leader election lease (the heartbeat lhtx looks for)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-lease
  namespace: {{ $leaseNS }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-lease
  namespace: {{ $leaseNS }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.leaseReaderForAllUsers }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-lease-reader
  namespace: {{ $leaseNS }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [lhtx-agent]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-lease-reader
  namespace: {{ $leaseNS }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-lease-reader
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.rbac.leaseListForAllUsers }}
---
# lhtx finds a lease outside the Longhorn namespace by its label
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-lease-list
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-lease-list
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-lease-list
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.rbac.freezeRole }}
---
# lhtx diag through the agent (logs filtered in the cluster)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-diag
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [lhtx.io]
    resources: [logqueries]
    verbs: [get, list, watch, create, delete]
---
# Read the VolumeDigests (bind it to lhtx users who may not read volumes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-view
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [lhtx.io]
    resources: [volumedigests, volumehistories]
    verbs: [get, list, watch]
---
# Bind it with a RoleBinding in a namespace: who may switch PVCs there.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-switch
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [lhtx.io]
    resources: [switches]
    verbs: [get, list, watch, create, delete]
---
# Bind it to the people who may freeze: creating a Freeze stops every pod
# that uses the listed PVCs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-freeze
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [lhtx.io]
    resources: [freezes]
    verbs: [get, list, watch, create, delete]
{{- end }}
{{- end }}
