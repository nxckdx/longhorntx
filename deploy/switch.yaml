# Switch: a request to the lhtx agent to point a PVC to another Longhorn
# volume (restoring a backup first if asked) – lhtx switch / restore --switch.
# Lives in the PVC's namespace. Deleting it does not undo anything.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: switches.lhtx.io
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  group: lhtx.io
  scope: Namespaced
  names:
    kind: Switch
    listKind: SwitchList
    plural: switches
    singular: switch
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: PVC
          type: string
          jsonPath: .spec.pvc
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Target
          type: string
          jsonPath: .status.targetVolume
        - name: By
          type: string
          jsonPath: .spec.requestedBy
          priority: 1
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [pvc, requestedBy]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: a Switch cannot be changed – create a new one
                - rule: has(self.toVolume) != has(self.fromBackup)
                  message: give either toVolume or fromBackup
              properties:
                pvc:
                  description: The PVC to switch, in this namespace.
                  type: string
                  maxLength: 253
                toVolume:
                  description: An existing Longhorn volume (restored, cloned, or the PVC's old one).
                  type: string
                  maxLength: 63
                fromBackup:
                  description: A Longhorn Backup to restore into a new volume first.
                  type: string
                  maxLength: 63
                volumeName:
                  description: Name of the restored volume (fromBackup).
                  type: string
                  maxLength: 40
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 20
                wait:
                  type: string
                  pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                requestedBy:
                  description: Who asks – checked against the real user by the admission policy lhtx-switch-requester.
                  type: string
                requestedGroups:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
# Vouches for spec.requestedBy/requestedGroups: the agent acts for that user
# (after asking the API server what the user may do) and refuses to work
# without this policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lhtx-switch-requester
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [lhtx.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [switches, logqueries]
  validations:
    - expression: object.spec.requestedBy == request.userInfo.username
      message: spec.requestedBy must be your own user name (lhtx fills it in)
    - expression: >-
        (has(object.spec.requestedGroups) ? object.spec.requestedGroups : []) ==
        (has(request.userInfo.groups) ? request.userInfo.groups : [])
      message: spec.requestedGroups must be your own groups (lhtx fills them in)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lhtx-switch-requester
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  policyName: lhtx-switch-requester
  validationActions: [Deny]
---
# For people who may switch PVCs through the agent – bind it with a
# RoleBinding in their namespace. The agent still checks that they may
# delete/create the PVC and delete its pods, and that only the PVC's own
# data is used.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lhtx-switch
rules:
  - apiGroups: [lhtx.io]
    resources: [switches]
    verbs: [get, list, watch, create, delete]
