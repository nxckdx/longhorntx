# LogQuery: lhtx diag asks the lhtx agent for a volume's Longhorn logs; the
# agent reads them in the cluster, keeps the lines that mention the volume
# and answers in the status (gzipped) – only those lines travel. Removed
# by lhtx after reading (the agent removes leftovers after 15 minutes).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: logqueries.lhtx.io
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  group: lhtx.io
  scope: Namespaced
  names:
    kind: LogQuery
    listKind: LogQueryList
    plural: logqueries
    singular: logquery
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [volume, requestedBy]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: a LogQuery cannot be changed
              properties:
                volume:
                  type: string
                  maxLength: 63
                nodes:
                  type: array
                  items:
                    type: string
                since:
                  type: string
                  pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                limitBytes:
                  type: integer
                  minimum: 0
                requestedBy:
                  type: string
                requestedGroups:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
# Who may run lhtx diag through the agent (bind it yourself; they must be
# allowed to read pod logs in the Longhorn namespace as well – the agent
# checks).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lhtx-diag
rules:
  - apiGroups: [lhtx.io]
    resources: [logqueries]
    verbs: [get, list, watch, create, delete]
