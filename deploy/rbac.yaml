# The agent stops and starts apps: it deletes pods anywhere, execs hook
# commands in them, creates admission policies and patches the owners of
# the pods it stopped (Deployments, StatefulSets, operator resources – any
# kind, hence "*"). Treat it like cluster-admin; a local lhtx freeze needs
# these rights too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lhtx-agent
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lhtx-agent
rules:
  - apiGroups: [lhtx.io]
    resources: [freezes, switches]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [lhtx.io]
    resources: [freezes/status, freezes/finalizers, switches/status]
    verbs: [get, patch, update]
  - apiGroups: [lhtx.io]
    resources: [volumedigests, volumehistories]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create] # what may the person who asked for a Switch do?
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [authentication.k8s.io]
    resources: [selfsubjectreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete] # create: only the server dry run that checks the policy
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete] # create/delete: switches
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, create, patch] # switches: PV of the target, Retain on the old one
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create] # switches of encrypted volumes: guard the key, keep a copy if it is replaced
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get, list, watch, create] # watch: VolumeDigests; create: restore for a Switch # create: restore for a Switch
  - apiGroups: [longhorn.io]
    resources: [settings, backupvolumes, engines]
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [replicas, backups]
    verbs: [get, list, watch] # history: rebuilds, failed replicas, backups
  # owners of the stopped pods: read the chain, nudge on unfreeze,
  # CloudNativePG hibernation annotation
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lhtx-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lhtx-agent
subjects:
  - kind: ServiceAccount
    name: lhtx-agent
    namespace: longhorn-system
---
# leader election lease + the hooks ConfigMap
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lhtx-agent
  namespace: longhorn-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [lhtx-hooks]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lhtx-agent
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lhtx-agent
subjects:
  - kind: ServiceAccount
    name: lhtx-agent
    namespace: longhorn-system
---
# lhtx finds the agent by reading its lease (who holds it, when renewed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lhtx-agent-lease-reader
  namespace: longhorn-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [lhtx-agent]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lhtx-agent-lease-reader
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lhtx-agent-lease-reader
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
---
# For people who may freeze through the agent (bind it yourself). Creating a
# Freeze stops every pod that uses the listed PVCs – grant it like the right
# to delete those pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lhtx-freeze
rules:
  - apiGroups: [lhtx.io]
    resources: [freezes]
    verbs: [get, list, watch, create, delete]
