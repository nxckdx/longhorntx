name: auto-pr

# A push to a new branch opens a pull request to main (if there is none yet).
# Merge it with a merge commit or "rebase and merge", not squash:
# release-please builds the changelog from the individual commits.

on:
  push:
    branches-ignore:
      - main
      - "release-please--**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.pr.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "a pull request for $BRANCH is already open"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin main
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then
            echo "nothing to merge"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "Commits:"
            echo
            git log --reverse --format='- %s' origin/main..HEAD
            echo
            echo "Merge with a merge commit or rebase – not squash (release-please reads the commits)."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # the new PR's CI (a PR opened with the workflow token starts no workflows)
  ci:
    needs: open
    if: needs.open.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml
