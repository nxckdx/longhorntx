{{- if .Values.metrics.dashboard.enabled }}
# Grafana dashboard, picked up by the Grafana sidecar (kube-prometheus-stack:
# label grafana_dashboard: "1")
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lhtx-agent.fullname" . }}-dashboard
  namespace: {{ .Values.metrics.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "lhtx-agent.labels" . | nindent 4 }}
    {{- toYaml .Values.metrics.dashboard.labels | nindent 4 }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  lhtx-agent.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}
{{- end }}
