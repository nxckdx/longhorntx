apiVersion: apps/v1
kind: Deployment
metadata:
  name: lhtx-agent
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  replicas: 1 # more replicas wait as standby (leader election)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lhtx-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lhtx-agent
    spec:
      serviceAccountName: lhtx-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/nxckdx/lhtx:latest
          args: [agent, --namespace=longhorn-system]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# the read-only health/metrics port (/healthz, /readyz, /metrics)
apiVersion: v1
kind: Service
metadata:
  name: lhtx-agent
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: lhtx-agent
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: lhtx-agent
  ports:
    - name: health
      port: 8081
      targetPort: health
