{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: volumedigests.lhtx.io
  labels:
    app.kubernetes.io/name: lhtx-agent
spec:
  group: lhtx.io
  scope: Namespaced
  names:
    kind: VolumeDigest
    listKind: VolumeDigestList
    plural: volumedigests
    singular: volumedigest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            data:
              description: The volume's fields lhtx uses – gzipped JSON, base64 (prefix gz:).
              type: string
{{- end }}
